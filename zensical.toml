[project]
repo_url = "https://github.com/CentreForDigitalHumanities/BioPAP/tree/develop"
edit_uri = "docs"
site_name = "BioPAP"
nav = [
  { Home = "index.md" },
  { Installation = "installation.md" },
  { "User guide" = "guide.md" },
  { Tutorials = [
    { "Building pipeline" = "tutorials/building_pipeline.md" },
    { Configuration = "tutorials/configuration.md" },
    { "Batch Running" = "tutorials/run_batch.md" },
    { "ICA Example" = "tutorials/notebook_ica.md" },
    { "ROI Example" = "tutorials/notebook_roi.md" },
  ] },
  { Modules = [
    "api/index.md",
    { Anonymize = "api/anonymize.md" },
    { ArtifactReject = "api/artifact_reject.md" },
    { BaselineCorrection = "api/baseline_correction.md" },
    { BIDSConversion = "api/bids.md" },
    { BlinkDetection = "api/blink_detection.md" },
    { Downsample = "api/downsample.md" },
    { EOGChannels = "api/eog_channels.md" },
    { EventsFromAnnotations = "api/events_from_annotations.md" },
    { IIRFilter = "api/iir_filter.md" },
    { LoadData = "api/load_data.md" },
    { Metadata = "api/metadata.md" },
    { NotchFilter = "api/notch_filter.md" },
    { Plot = "api/plot.md" },
    { Rereference = "api/rereference.md" },
    { SaveOutput = "api/save_output.md" },
    { Segmentation = "api/segmentation.md" },
    { SetChannelTypeAndMontage = "api/set_channel_type_and_montage.md" },
  ] },
]

[project.theme]
features = [
  "navigation.indexes",
  "content.code.copy",
  "search.highlight",
  "content.action.edit", 
  "content.action.view"
]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_root_heading = false
show_root_full_path = false
show_source = false
