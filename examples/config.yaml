Anonymize:
- __biopap_module: <class 'biopap.modules.anonymize.Anonymize'>
- daysback: 100
- experimenter: J. Jansen
- participant_id: AB00123
Rereference:
- __biopap_module: <class 'biopap.modules.rereference.Rereference'>
- ref_channels:
  - EXG1
  - EXG2
- ch_type: auto
Plot:
- __biopap_module: <class 'biopap.modules.plot.Plot'>
- plot_types: 1
- save_folder: ./
- save_postfix: IRR
- save_overwrite: false
EOGChannels:
- __biopap_module: <class 'biopap.modules.eog_channels.EOGChannels'>
- ref_channels:
  - hEOG
  - vEOG
- anode_channels:
  - EXG3
  - EXG5
- cathode_channels:
  - EXG4
  - EXG6
- drop_refs: false
IIRFilter:
- __biopap_module: <class 'biopap.modules.iir_filter.IIRFilter'>
- l_freq: 0.1
- h_freq: 35
- order: 4
- ftype: butter
Downsample:
- __biopap_module: <class 'biopap.modules.downsample.Downsample'>
- sfreq: 500
- resample_events: true
Segmentation:
- __biopap_module: <class 'biopap.modules.segmentation.Segmentation'>
- stim_channel: Status
- start: -0.2
- end: 0.8
- baseline:
  - null
  - 0
- reference_markers:
    range: 1-69
ArtifactReject:
- __biopap_module: <class 'biopap.modules.artifact_reject.ArtifactReject'>
- mode: interpolation
- max_gradient_uv: 50
- max_amplitude_uv: 75
- min_activity_uv: 0.5
- interval_ms: 100
BaselineCorrection:
- __biopap_module: <class 'biopap.modules.baseline_correction.BaselineCorrection'>
- baseline:
  - -0.2
  - 0
SaveOutput:
- __biopap_module: <class 'biopap.modules.save_output.SaveOutput'>
- export_formats: fif
- output_file: ./partially_processed.fif
- overwrite: true
- steps_completed: []
- intermediate: _before_ICA
ApplyICA:
- __biopap_module: <class 'biopap.modules.apply_ica.ApplyICA'>
- method: fastica
Plot_2:
- __biopap_module: <class 'biopap.modules.plot.Plot'>
- plot_types: 1
- save_postfix: null
- save_overwrite: false
- title: Preprocessed data
SaveOutput_2:
- __biopap_module: <class 'biopap.modules.save_output.SaveOutput'>
- export_formats: fif
- output_file: ./processed_data-epo.fif
- overwrite: true
- steps_completed: []
- intermediate: false
